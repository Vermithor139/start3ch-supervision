<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verum Invest | Client Access</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #02040a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .box { width: 100%; max-width: 400px; padding: 40px; background: #060b16; border: 1px solid #1e293b; border-radius: 12px; text-align: center; }
        h1 { font-size: 1.5rem; letter-spacing: 3px; margin-bottom: 5px; }
        .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #0ea5e9; letter-spacing: 4px; margin-bottom: 30px; }
        input { width: 100%; background: #02040a; border: 1px solid #1e293b; border-radius: 6px; padding: 14px; color: #f8fafc; font-family: 'JetBrains Mono', monospace; margin-bottom: 15px; outline: none; box-sizing: border-box;}
        input:focus { border-color: #0ea5e9; }
        button { width: 100%; background: #0ea5e9; color: #000; border: none; padding: 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        button:hover { box-shadow: 0 0 20px rgba(14,165,233,0.4); }
        .error { color: #ef4444; font-size: 0.8rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>VERUM</h1>
        <div class="sub">INVEST PORTAL</div>
        <form onsubmit="clientLogin(event)">
            <input type="email" id="email" placeholder="Client Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">ACCESS PORTAL</button>
            <div class="error" id="error">Invalid credentials. Please contact your advisor.</div>
        </form>
        <p style="margin-top: 30px; font-size: 0.75rem; color: #64748b;">Secure Client Environment</p>
    </div>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('email')) document.getElementById('email').value = params.get('email');
        }

        function clientLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            // Mock Client Authentication (In production, this checks a real database)
            // For prototype: Any email works if password is "Verum2026"
            if(pass === 'Verum2026' || pass === 'verum') {
                // Redirect to portal with pre-populated data
                const name = new URLSearchParams(window.location.search).get('name') || 'Client';
                const id = new URLSearchParams(window.location.search).get('id') || 'TX-9999999';
                window.location.href = `/client?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&id=${id}`;
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
