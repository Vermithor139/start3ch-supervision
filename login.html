<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verum Invest | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #02040a; --card: #060b16; --border: #1e293b; --text: #f8fafc; --muted: #64748b; --accent: #0ea5e9; --red: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 50%, #0a1120 0%, #02040a 100%); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center; }
        .logo { width: 50px; height: 50px; margin: 0 auto 15px; }
        h1 { font-size: 1.5rem; letter-spacing: 3px; margin-bottom: 5px; }
        .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 30px; }
        input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; color: var(--text); font-family: 'JetBrains Mono', monospace; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(14,165,233,0.2); }
        button { width: 100%; background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        button:hover { box-shadow: 0 0 20px rgba(14,165,233,0.4); transform: translateY(-2px); }
        .error { color: var(--red); font-size: 0.8rem; margin-top: 15px; display: none; font-family: 'JetBrains Mono', monospace; }
        .ip-tag { margin-top: 30px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); }
        .ip-tag span { color: var(--accent); background: rgba(14,165,233,0.1); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <svg class="logo" viewBox="0 0 40 40" fill="none"><path d="M8 6 L20 34 L32 6 L26 6 L20 22 L14 6 Z" fill="#0ea5e9"/><path d="M14 6 L20 22 L26 6 L22 6 L20 14 L18 6 Z" fill="#38bdf8" opacity="0.6"/></svg>
        <h1>VERUM</h1><div class="sub">INVEST</div>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="email" placeholder="Agent Email" required>
            <input type="password" id="password" placeholder="Access Key" required>
            <button type="submit">AUTHENTICATE</button>
            <div class="error" id="error">ACCESS DENIED: INVALID CREDENTIALS</div>
        </form>
        <div class="ip-tag">SECURE NODE: <span>191.96.215.107</span></div>
    </div>
    <script>
        const staffDB = {
            'r.palomino@verum.invest': { pass: 'Vrm_Mgr_2026!Alpha', role: 'MANAGER', name: 'Roberto Palomino' },
            'd.costa@verum.invest': { pass: 'FamiliaToreto', role: 'ASST_MANAGER', name: 'Dominick Charles Costa' },
            'k.dean@verum.invest': { pass: 'Vrm_Ast_2026!Bravo', role: 'ASST_MANAGER', name: 'Kenet James Dean' },
            's.jaeger@verum.invest': { pass: 'Vrm_Cls_2026!Sandro', role: 'CLOSER', name: 'Sandro Kevin Jaeger' },
            'j.davis@verum.invest': { pass: 'Vrm_Cls_2026!Jessica', role: 'CLOSER', name: 'Jessica Margaret Davis' },
            'd.balmer@verum.invest': { pass: 'Vrm_Cls_2026!David', role: 'CLOSER', name: 'David James Balmer' },
            'm.cohen@verum.invest': { pass: 'Vrm_Cls_2026!Marc', role: 'CLOSER', name: 'Marc Benjamin Cohen' },
            'n.lucas@verum.invest': { pass: 'Vrm_Cls_2026!Nicolas', role: 'CLOSER', name: 'Nicolas Augusto Lucas' },
            'p.gonzales@verum.invest': { pass: 'Vrm_Cls_2026!Patricia', role: 'CLOSER', name: 'Patricia Gonzales' },
            'j.frederick@verum.invest': { pass: 'Vrm_Cls_2026!Joe', role: 'CLOSER', name: 'Joe Henry Frederick' },
            'a.merlano@verum.invest': { pass: 'Vrm_Cls_2026!Ana', role: 'CLOSER', name: 'Ana Maria Merlano' },
            'j.briceno@verum.invest': { pass: 'Vrm_Cls_2026!Juan', role: 'CLOSER', name: 'Juan Diego Briceño' },
            'f.villari@verum.invest': { pass: 'Vrm_Cls_2026!Fiorella', role: 'CLOSER', name: 'Fiorella Villari' },
            'a.morales@verum.invest': { pass: 'Vrm_Cls_2026!Andres', role: 'CLOSER', name: 'Andres Morales' },
            'f.brauer@verum.invest': { pass: 'Vrm_Cls_2026!Fernando', role: 'CLOSER', name: 'Fernando Brauer' }
        };
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const user = staffDB[email];
            if (user && user.pass === pass) {
                sessionStorage.setItem('verum_role', user.role);
                sessionStorage.setItem('verum_user', user.name);
                window.location.href = '/';
            } else { document.getElementById('error').style.display = 'block'; }
        }
    </script>
</body>
</html>
