<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verum Invest | Start Trading</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #02040a; --card: #060b16; --border: #1e293b; --text: #f8fafc; --accent: #0ea5e9; --green: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 50%, #0a1120 0%, #02040a 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 2rem; letter-spacing: 4px; color: #fff; }
        .logo span { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--accent); letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(14,165,233,0.2); }
        button { width: 100%; background: var(--green); color: #000; border: none; padding: 16px; border-radius: 6px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { box-shadow: 0 0 20px rgba(16,185,129,0.4); transform: translateY(-2px); }
        .success-msg { display: none; text-align: center; color: var(--green); font-weight: 600; margin-top: 20px; padding: 20px; border: 1px solid var(--green); border-radius: 6px; background: rgba(16,185,129,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>VERUM</h1>
            <span>INVEST PORTAL</span>
        </div>
        <form id="leadForm" onsubmit="submitLead(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required placeholder="+1 234 567 890">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="country" required placeholder="Argentina">
            </div>
            <div class="form-group">
                <label>How did you hear about us?</label>
                <select id="source">
                    <option>Facebook Ads</option>
                    <option>Instagram</option>
                    <option>TikTok</option>
                    <option>Referral</option>
                    <option>Google Search</option>
                    <option>Other</option>
                </select>
            </div>
            <button type="submit">START INVESTING</button>
        </form>
        <div id="successMsg" class="success-msg">
            ✅ Application Received!<br>
            <span style="font-size: 0.9rem; color: #94a3b8; font-weight: 400; margin-top: 10px; display: block;">An advisor will contact you within 24 hours.</span>
        </div>
    </div>
    <script>
        async function submitLead(e) {
            e.preventDefault();
            const btn = document.querySelector('button');
            btn.textContent = 'Processing...';
            btn.disabled = true;

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value,
                source: document.getElementById('source').value
            };

            try {
                const response = await fetch('/api/leads/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    document.getElementById('leadForm').style.display = 'none';
                    document.getElementById('successMsg').style.display = 'block';
                } else {
                    alert('Error submitting form. Please try again.');
                    btn.textContent = 'START INVESTING';
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Connection error. Please check your internet.');
                btn.textContent = 'START INVESTING';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
