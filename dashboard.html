    <script>
        let db = { agents: ["ALL"], clients: {}, timestamp: 0, synced_at: 0 };
        let currentFilter = 'ALL'; 
        let currentClient = null;
        let currentUserRole = 'MANAGER'; 
        let currentUserName = 'Roberto Palomino';
        let currentStatusFilter = 'ALL';
        let selectedLeads = new Set();
        
        let saveQueue = [];
        let isProcessingQueue = false;
        let saveVersion = 0;
        
        const EMAIL_TO_AGENT = {
            's.jaeger@verum.invest': 'SANDRO', 'j.davis@verum.invest': 'JESSICA',
            'd.balmer@verum.invest': 'DAVID', 'm.cohen@verum.invest': 'MARC',
            'n.lucas@verum.invest': 'NICOLAS', 'p.gonzales@verum.invest': 'PATRICIA',
            'j.frederick@verum.invest': 'JOE', 'a.merlano@verum.invest': 'ANA',
            'j.briceno@verum.invest': 'JUAN', 'f.villari@verum.invest': 'FIORELLA',
            'a.morales@verum.invest': 'ANDRES', 'f.brauer@verum.invest': 'FERNANDO',
            'a.medina@verum.invest': 'ADRIANO', 'm.gomez@verum.invest': 'MAURICIO'
        };

        function showSaveStatus(message, type) {
            const statusEl = document.getElementById('save-status');
            if (!statusEl) return;
            statusEl.textContent = message;
            statusEl.className = 'save-status ' + type;
            setTimeout(() => { statusEl.className = 'save-status'; }, 3000);
        }

        function showSaveIndicator(show) {
            const indicator = document.getElementById('save-indicator');
            if (!indicator) return;
            if (show) indicator.classList.add('active');
            else indicator.classList.remove('active');
        }

        function queueSave() {
            saveVersion++;
            const version = saveVersion;
            return new Promise((resolve, reject) => {
                saveQueue.push({ version, resolve, reject });
                processSaveQueue();
            });
        }

        async function processSaveQueue() {
            if (isProcessingQueue) return;
            isProcessingQueue = true;
            
            while (saveQueue.length > 0) {
                const { version, resolve, reject } = saveQueue.shift();
                if (version < saveVersion) { resolve(false); continue; }
                
                try {
                    showSaveIndicator(true);
                    const payload = { ...db, synced_at: db.synced_at };
                    console.log(`[Save v${version}] Starting save with ${Object.keys(db.clients).length} clients`);
                    
                    const response = await fetch('/api/db/update', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload) 
                    });
                    
                    const result = await response.json();
                    console.log(`[Save v${version}] Response:`, result);
                    
                    if (result.status === 'error') {
                        showSaveStatus('Save failed: ' + result.message, 'error');
                        reject(new Error(result.message));
                    } else {
                        db.synced_at = Date.now();
                        showSaveStatus(`Saved ${Object.keys(db.clients).length} clients to Firebase`, 'success');
                        resolve(true);
                    }
                } catch (error) {
                    console.error(`[Save v${version}] Error:`, error);
                    showSaveStatus('Network error', 'error');
                    reject(error);
                } finally {
                    showSaveIndicator(false);
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            isProcessingQueue = false;
        }

        function getMyAgentCode() {
            const email = localStorage.getItem('verum_email');
            if (email && EMAIL_TO_AGENT[email.toLowerCase()]) return EMAIL_TO_AGENT[email.toLowerCase()];
            const nameToAgent = { 
                'Sandro Kevin Jaeger': 'SANDRO', 'Jessica Margaret Davis': 'JESSICA', 'David James Balmer': 'DAVID', 'Marc Benjamin Cohen': 'MARC', 'Nicolas Augusto Lucas': 'NICOLAS', 'Patricia Gonzales': 'PATRICIA', 'Joe Henry Frederick': 'JOE', 'Ana Maria Merlano': 'ANA', 'Juan Diego Briceño': 'JUAN', 'Fiorella Villari': 'FIORELLA', 'Andres Morales': 'ANDRES', 'Fernando Brauer': 'FERNANDO', 'Adriano Medina': 'ADRIANO', 'Mauricio Gomez': 'MAURICIO'
            };
            if (nameToAgent[currentUserName]) return nameToAgent[currentUserName];
            return currentUserName.toUpperCase().split(' ')[0];
        }

        async function fetchDatabase() {
            try {
                const response = await fetch('/api/db');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                db = await response.json();
                if (!db.clients) db.clients = {};
                if (!db.agents) db.agents = ["ALL"];
                if (!db.timestamp) db.timestamp = 0;
                db.synced_at = db.timestamp || 0;
                console.log('Database loaded:', Object.keys(db.clients).length, 'clients');
                showSaveStatus(`Loaded ${Object.keys(db.clients).length} clients from Firebase`, 'success');
            } catch (error) { 
                console.error('Failed to fetch database:', error);
                db = { agents: ["ALL"], clients: {}, timestamp: 0, synced_at: 0 };
                showSaveStatus('Failed to load database', 'error');
            }
        }

        // Helper to update all agent dropdowns
        function updateAllAgentDropdowns() {
            const agentsList = db.agents.filter(a => a !== 'ALL');
            const htmlOptions = agentsList.map(a => `<option value="${a}">${a}</option>`).join('');
            
            // Update Bulk Assign Dropdown
            const bulkSelect = document.getElementById('bulk-agent-select');
            if(bulkSelect) bulkSelect.innerHTML = '<option value="">Assign to Agent...</option>' + htmlOptions;
            
            // Update Inject Lead Modal Dropdown
            const injectSelect = document.getElementById('lead-agent');
            if(injectSelect) injectSelect.innerHTML = htmlOptions;
        }
        
        async function initCRM() { 
            await fetchDatabase();
            updateAllAgentDropdowns(); // Initial population
            
            let role = localStorage.getItem('verum_role'); 
            let name = localStorage.getItem('verum_user');
            if (!role || !name) { window.location.href = '/login'; return; }
            
            currentUserRole = role; currentUserName = name;
            document.getElementById('user-name-display').textContent = name;
            document.getElementById('user-role-display').textContent = `[${role.replace('_', ' ').toUpperCase()}]`;

            if (role === 'CLOSER') { 
                document.getElementById('nav-analytics').style.display = 'none'; 
                document.getElementById('nav-config').style.display = 'none'; 
                document.getElementById('financial-controls').style.display = 'none';
                document.getElementById('inject-lead-btn').style.display = 'none';
                document.getElementById('btn-save-profile').style.display = 'none';
            } else { 
                document.getElementById('nav-analytics').style.display = 'flex'; 
                document.getElementById('nav-config').style.display = 'flex'; 
                document.getElementById('financial-controls').style.display = 'block';
                document.getElementById('inject-lead-btn').style.display = 'inline-flex';
                document.getElementById('btn-save-profile').style.display = 'inline-flex';
            }

            renderAgentTabs(); renderTable(); checkWithdrawalAlerts(); updateLeadCounter();
        }

        function updateLeadCounter() { document.getElementById('lead-count-display').textContent = Object.keys(db.clients).length; }

        function renderAgentTabs() { 
            const container = document.getElementById('agent-tabs-container'); 
            container.style.display = 'flex';
            let html = `<span class="filter-section-label">Status:</span>`;
            ['ALL', 'POTENTIAL', 'ACTIVE', 'RECOVERY', 'NEW', 'REASSIGN'].forEach(s => { html += `<div class="filter-tab ${currentStatusFilter === s ? 'active' : ''}" onclick="filterByStatus('${s}', this)">${s}</div>`; });
            if (currentUserRole !== 'CLOSER') {
                html += `<span class="filter-section-label" style="margin-left: 20px;">Agent:</span><div class="filter-tab add-btn" onclick="addFilter()">+ ADD AGENT</div>`; 
                db.agents.forEach((agent, index) => { 
                    const isActive = currentFilter === agent ? 'active' : ''; 
                    const deleteBtn = agent !== 'ALL' ? `<span class="delete-agent" onclick="deleteAgent(${index}, event)">✕</span>` : ''; 
                    html += `<div class="filter-tab ${isActive}" onclick="filterTable('${agent}', this)">${agent}${deleteBtn}</div>`; 
                });
            } else { html += `<span class="filter-section-label" style="margin-left: 20px; color: var(--hud-green);">My Database: ${getMyAgentCode()}</span>`; }
            container.innerHTML = html;
        }

        async function filterByStatus(status, el) { currentStatusFilter = status; renderAgentTabs(); renderTable(); }
        
        async function deleteAgent(index, event) { 
            event.stopPropagation(); 
            const removed = db.agents[index]; 
            if (confirm(`Remove agent "${removed}"?`)) { 
                db.agents.splice(index, 1); 
                await queueSave(); 
                updateAllAgentDropdowns(); // FIX: Update dropdowns after deletion
                if (currentFilter === removed) currentFilter = 'ALL'; 
                renderAgentTabs(); 
                renderTable(); 
            } 
        }
        
        function renderTable() { 
            const tbody = document.getElementById('lead-table-body'); tbody.innerHTML = ''; 
            let clients = Object.values(db.clients); 
            
            clients.sort((a, b) => {
                const aActivity = a.lastActivity || 0;
                const bActivity = b.lastActivity || 0;
                if (aActivity !== bActivity) return bActivity - aActivity;
                const aComment = (a.comments && a.comments.length > 0) ? a.comments[0].time : '';
                const bComment = (b.comments && b.comments.length > 0) ? b.comments[0].time : '';
                return bComment.localeCompare(aComment);
            });
            
            if (currentUserRole === 'CLOSER') clients = clients.filter(c => c.agent === getMyAgentCode());
            if (currentStatusFilter !== 'ALL') clients = clients.filter(c => c.retention === currentStatusFilter || c.subStatus === currentStatusFilter || c.status === currentStatusFilter);
            if (currentUserRole !== 'CLOSER' && currentFilter !== 'ALL') clients = clients.filter(c => c.agent === currentFilter);
            
            const searchTerm = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '';
            if (searchTerm) {
                clients = clients.filter(c => (c.name || '').toLowerCase().includes(searchTerm));
            }
            
            const canModifyDepositor = currentUserRole !== 'CLOSER';
            const canDelete = currentUserRole !== 'CLOSER';
            
            clients.forEach((c) => { 
                const tr = document.createElement('tr'); 
                if (selectedLeads.has(c.txId)) tr.classList.add('selected');
                tr.onclick = (e) => { if(e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') openProfile(c.txId); }; 
                
                let actionCell = canDelete ? `<td><button class="btn-hud red" style="padding: 4px 8px; font-size: 0.7rem;" onclick="event.stopPropagation(); deleteClient('${c.txId}')">DELETE</button></td>` : `<td></td>`;
                
                const lastComment = (c.comments && c.comments.length > 0) ? c.comments[0].text : (c.comment || '');
                const lastActivity = c.lastActivity ? new Date(c.lastActivity).toLocaleString() : (c.lastLogin || 'N/A');
                
                tr.innerHTML = `<td><input type="checkbox" ${selectedLeads.has(c.txId) ? 'checked' : ''} onclick="toggleSelection('${c.txId}', this)"></td>
                <td><a href="#" class="client-link" onclick="event.preventDefault(); openProfile('${c.txId}')">${c.name || 'Unknown'}</a><div class="client-id">${c.txId}</div></td>
                <td>${c.country || 'Unknown'} ${c.flag || '🌎'}</td>
                <td><span class="role-badge" style="background: rgba(255,255,255,0.1); color: var(--hud-muted); font-size: 0.65rem;">${c.source || 'Unknown'}</span></td>
                <td style="font-family: var(--font-data); font-size: 0.85rem; font-weight: 600; color: var(--hud-glow);">${c.agent || 'UNASSIGNED'}</td>
                <td style="font-family: var(--font-data); font-size: 0.75rem;">${lastActivity}</td>
                <td style="font-weight: 700;">$${(c.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td class="text-red">-$${(c.withdrawn || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td style="font-weight: 700;">$${(c.deposit || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                <td>
                    <select class="status-select status-depositor" onclick="event.stopPropagation()" onchange="updateStatus('${c.txId}', 'status', this.value)" ${!canModifyDepositor ? 'disabled' : ''}>
                        <option value="NEW LEAD" ${c.status === 'NEW LEAD' ? 'selected' : ''}>NEW LEAD</option>
                        <option value="DEPOSITOR" ${c.status === 'DEPOSITOR' ? 'selected' : ''}>DEPOSITOR</option>
                    </select>
                </td>
                <td>
                    <select class="status-select status-retention" onclick="event.stopPropagation()" onchange="updateStatus('${c.txId}', 'retention', this.value)">
                        <option value="NEW" ${c.retention === 'NEW' ? 'selected' : ''}>NEW</option>
                        <option value="ACTIVE" ${c.retention === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                        <option value="REASSIGN" ${c.retention === 'REASSIGN' ? 'selected' : ''}>REASSIGN</option>
                        <option value="RECOVERY" ${c.retention === 'RECOVERY' ? 'selected' : ''}>RECOVERY</option>
                    </select>
                </td>
                <td>
                    <select class="status-select status-sub" onclick="event.stopPropagation()" onchange="updateStatus('${c.txId}', 'subStatus', this.value)">
                        <option value="NO POTENTIAL" ${c.subStatus === 'NO POTENTIAL' ? 'selected' : ''}>NO POTENTIAL</option>
                        <option value="POTENTIAL" ${c.subStatus === 'POTENTIAL' ? 'selected' : ''}>POTENTIAL</option>
                        <option value="NO INTEREST" ${c.subStatus === 'NO INTEREST' ? 'selected' : ''}>NO INTEREST</option>
                    </select>
                </td>
                <td><div class="comment-preview" title="${lastComment}">${lastComment}</div></td>
                ${actionCell}`; 
                tbody.appendChild(tr); 
            }); 
            if (clients.length === 0) tbody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding: 40px; color: var(--hud-muted);">No clients found.</td></tr>';
        }

        function toggleSelection(txId, checkbox) {
            if (checkbox.checked) selectedLeads.add(txId);
            else selectedLeads.delete(txId);
            updateBulkUI();
            renderTable();
        }

        function toggleSelectAll(checkbox) {
            const visibleClients = getVisibleClients();
            visibleClients.forEach(c => {
                if (checkbox.checked) selectedLeads.add(c.txId);
                else selectedLeads.delete(c.txId);
            });
            updateBulkUI();
            renderTable();
        }

        function getVisibleClients() {
            let clients = Object.values(db.clients);
            if (currentUserRole === 'CLOSER') clients = clients.filter(c => c.agent === getMyAgentCode());
            if (currentStatusFilter !== 'ALL') clients = clients.filter(c => c.retention === currentStatusFilter || c.subStatus === currentStatusFilter || c.status === currentStatusFilter);
            if (currentUserRole !== 'CLOSER' && currentFilter !== 'ALL') clients = clients.filter(c => c.agent === currentFilter);
            const searchTerm = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '';
            if (searchTerm) {
                clients = clients.filter(c => (c.name || '').toLowerCase().includes(searchTerm));
            }
            return clients;
        }

        function updateBulkUI() {
            const bar = document.getElementById('bulk-action-bar');
            const count = document.getElementById('selected-count');
            if (selectedLeads.size > 0) {
                bar.classList.add('active');
                count.textContent = selectedLeads.size;
            } else {
                bar.classList.remove('active');
            }
        }

        function clearSelection() {
            selectedLeads.clear();
            document.getElementById('select-all').checked = false;
            updateBulkUI();
            renderTable();
        }

        async function bulkAssign() {
            const agent = document.getElementById('bulk-agent-select').value;
            if (!agent) { alert('Please select an agent.'); return; }
            const count = selectedLeads.size;
            if (!confirm(`Assign ${count} leads to ${agent}?`)) return;
            
            selectedLeads.forEach(txId => {
                if (db.clients[txId]) {
                    db.clients[txId].agent = agent;
                    db.clients[txId].lastActivity = Date.now();
                }
            });
            await queueSave();
            clearSelection();
            renderTable();
            alert(`✅ Assigned ${count} leads to ${agent}.`);
        }

        async function bulkDelete() {
            const count = selectedLeads.size;
            if (!confirm(`⚠️ Permanently delete ${count} leads? This cannot be undone.`)) return;
            
            selectedLeads.forEach(txId => {
                delete db.clients[txId];
            });
            await queueSave();
            clearSelection();
            renderTable();
            updateLeadCounter();
        }

        async function deleteClient(txId) { if (currentUserRole === 'CLOSER') return; if (confirm('Are you sure?')) { delete db.clients[txId]; await queueSave(); renderTable(); updateLeadCounter(); showView('leads'); } }
        async function clearTestLeads() { if (currentUserRole === 'CLOSER') { alert('Permission denied.'); return; } if (confirm('⚠️ Delete ALL test leads?')) { const testLeads = Object.keys(db.clients).filter(id => db.clients[id].name && db.clients[id].name.toLowerCase().includes('test')); testLeads.forEach(id => delete db.clients[id]); await queueSave(); renderTable(); updateLeadCounter(); alert(`✅ Cleared ${testLeads.length} test leads.`); } }
        
        async function updateStatus(txId, field, value) { 
            if (db.clients[txId]) { 
                db.clients[txId][field] = value; 
                db.clients[txId].lastActivity = Date.now();
                await queueSave(); 
                renderTable();
            } 
        }
        
        function filterTable(agent, el) { currentFilter = agent; renderAgentTabs(); renderTable(); }
        
        async function addFilter() { 
            const name = prompt("Enter Agent Name:").trim().toUpperCase(); 
            if (name) { 
                if(!db.agents.includes(name)) { 
                    db.agents.push(name); 
                    await queueSave(); 
                    updateAllAgentDropdowns(); // FIX: Update dropdowns immediately after adding
                } 
                currentFilter = name; 
                renderAgentTabs(); 
                renderTable(); 
            } 
        }
        
        function checkWithdrawalAlerts() { 
            let pendingCount = 0; const pendingList = []; 
            Object.values(db.clients).forEach(c => { if (c.withdrawals) c.withdrawals.forEach(w => { if (w.status === 'PENDING') { pendingCount++; pendingList.push({ txId: c.txId, name: c.name, amount: w.amount, method: w.method, wdId: w.id }); } }); }); 
            const badge = document.getElementById('wd-badge'); const countSpan = document.getElementById('notif-count'); const listContainer = document.getElementById('notif-list'); 
            if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'block'; countSpan.textContent = pendingCount; listContainer.innerHTML = pendingList.map(p => `<div class="notif-item" onclick="routeToWithdrawal('${p.txId}')"><div class="notif-item-title"><span>${p.name}</span><span style="color: var(--status-orange);">$${p.amount.toFixed(2)}</span></div><div class="notif-item-desc">Requesting withdrawal via ${p.method}</div><div class="notif-item-action">View & Approve →</div></div>`).join(''); } 
            else { badge.style.display = 'none'; countSpan.textContent = '0'; listContainer.innerHTML = '<div class="notif-empty">No pending withdrawal requests.</div>'; } 
            document.getElementById('analytics-pending').textContent = pendingCount; 
        }
        function toggleNotifDropdown(e) { e.stopPropagation(); document.getElementById('notif-dropdown').classList.toggle('active'); }
        function routeToWithdrawal(txId) { document.getElementById('notif-dropdown').classList.remove('active'); switchMainView('leads', document.querySelector('.nav-item')); setTimeout(() => { openProfile(txId); }, 100); }
        document.addEventListener('click', function(e) { const dropdown = document.getElementById('notif-dropdown'); const bell = document.querySelector('.notif-bell'); if (!dropdown.contains(e.target) && !bell.contains(e.target)) { dropdown.classList.remove('active'); } });
        function switchMainView(viewName, navEl) { document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); if(navEl) navEl.classList.add('active'); document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active')); document.getElementById(`view-${viewName}`).classList.add('active'); const titles = { 'leads': 'LEAD <span>TELEMETRY</span> OVERVIEW', 'analytics': 'PERFORMANCE <span>ANALYTICS</span>', 'config': 'SYSTEM <span>CONFIGURATION</span>' }; document.getElementById('pageTitle').innerHTML = titles[viewName]; }
        function showView(viewName) { document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active')); document.getElementById(`view-${viewName}`).classList.add('active'); document.getElementById('pageTitle').innerHTML = viewName === 'leads' ? 'LEAD <span>TELEMETRY</span> OVERVIEW' : 'CLIENT <span>INTELLIGENCE</span> DOSSIER'; }
        function copyClientLink() { if (!currentClient) return; const domain = window.location.origin; const email = currentClient.name.toLowerCase().replace(' ', '.') + '@verum.invest'; const link = `${domain}/client-login?email=${encodeURIComponent(email)}&name=${encodeURIComponent(currentClient.name)}&id=${currentClient.txId}`; navigator.clipboard.writeText(link).then(() => alert('✅ Link Copied!')).catch(err => prompt("Copy manually:", link)); }

        function openProfile(txId) { 
            currentClient = db.clients[txId]; 
            if (!currentClient) { alert('Client data not found. Please refresh the page.'); return; }
            document.getElementById('p-name').textContent = currentClient.name || 'Unknown'; document.getElementById('p-id').textContent = currentClient.txId; 
            document.getElementById('p-phone').value = currentClient.phone || ''; document.getElementById('p-country').value = currentClient.country || '';
            document.getElementById('p-email').value = currentClient.email || ''; document.getElementById('p-source').value = currentClient.source || '';
            const isCloser = currentUserRole === 'CLOSER';
            document.getElementById('p-phone').disabled = isCloser; document.getElementById('p-country').disabled = isCloser; document.getElementById('p-email').disabled = isCloser; document.getElementById('p-source').disabled = isCloser;
            document.getElementById('p-balance').textContent = '$' + (currentClient.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2}); document.getElementById('p-deposited').textContent = '$' + (currentClient.deposit || 0).toLocaleString('en-US', {minimumFractionDigits: 2}); 
            const agentSelect = document.getElementById('p-agent-select'); agentSelect.innerHTML = db.agents.filter(a => a !== 'ALL').map(a => `<option ${a === currentClient.agent ? 'selected' : ''}>${a}</option>`).join(''); agentSelect.disabled = isCloser;
            document.getElementById('p-status-depositor').value = currentClient.status || 'NEW LEAD'; document.getElementById('p-status-retention').value = currentClient.retention || 'NEW'; document.getElementById('p-status-sub').value = currentClient.subStatus || 'POTENTIAL'; document.getElementById('p-status-depositor').disabled = isCloser;
            const commentContainer = document.getElementById('p-comments'); const comments = currentClient.comments || [];
            commentContainer.innerHTML = comments.length ? comments.map(comm => `<div class="comment-item"><div class="comment-meta"><span>${comm.agent}</span><span>${comm.time}</span></div><div class="comment-text">${comm.text}</div></div>`).join('') : '<div style="color:var(--hud-muted); font-size:0.85rem;">No comments yet.</div>'; 
            renderTransactionsForManager();
            const wdBody = document.getElementById('withdrawal-requests-body'); const withdrawals = currentClient.withdrawals || [];
            if (withdrawals.length === 0) wdBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--hud-muted); padding: 32px;">No pending withdrawal requests.</td></tr>'; 
            else wdBody.innerHTML = withdrawals.map(wd => { const statusClass = wd.status === 'PENDING' ? 'role-assistant' : 'role-closer'; const actionBtn = wd.status === 'PENDING' ? `<button class="btn-hud green" style="padding: 4px 12px; font-size: 0.7rem;" onclick="approveWithdrawal('${wd.id}')">APPROVE</button><button class="btn-hud red" style="padding: 4px 12px; font-size: 0.7rem; margin-left: 4px;" onclick="rejectWithdrawal('${wd.id}')">DENY</button>` : `<span style="color: var(--hud-muted); font-size: 0.8rem;">—</span>`; return `<tr><td style="font-family: var(--font-data); font-size: 0.8rem;">${wd.id}</td><td>${wd.date}</td><td>${wd.method}</td><td style="font-weight: 700;">$${wd.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td><td style="font-size: 0.8rem;">${wd.details || ''}</td><td><span class="role-badge ${statusClass}">${wd.status}</span></td><td>${actionBtn}</td></tr>`; }).join(''); 
            showView('profile'); 
        }

        function renderTransactionsForManager() {
            if (!currentClient) return;
            document.getElementById('manager-edit-controls').style.display = (currentUserRole === 'MANAGER' || currentUserRole === 'ASST_MANAGER') ? 'block' : 'none';
            const txBody = document.getElementById('transaction-history-body'); const editSelect = document.getElementById('edit-tx-select'); const transactions = currentClient.transactions || [];
            if (transactions.length === 0) { txBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--hud-muted); padding:20px;">No transactions yet.</td></tr>'; editSelect.innerHTML = '<option value="">-- No Transactions --</option>'; return; }
            txBody.innerHTML = transactions.map(tx => { const profitClass = tx.profit > 0 ? 'text-green' : (tx.profit < 0 ? 'text-red' : ''); return `<tr><td style="font-family: var(--font-data); font-size: 0.8rem;">${tx.id}</td><td>${tx.date}</td><td style="font-weight: 600;">${tx.type}</td><td>${tx.asset}</td><td>$${(tx.amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td><td class="${profitClass}" style="font-weight: 700;">${tx.profit > 0 ? '+' : ''}$${(tx.profit || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td><td><span class="role-badge role-closer">${tx.status}</span></td></tr>`; }).join('');
            editSelect.innerHTML = '<option value="">-- Select Transaction --</option>' + transactions.map(tx => `<option value="${tx.id}">${tx.id} - ${tx.asset} (${tx.profit > 0 ? '+' : ''}$${(tx.profit || 0).toFixed(2)})</option>`).join('');
        }

        async function editTransactionProfit() { if (!currentClient) return; const txId = document.getElementById('edit-tx-select').value; const newProfit = parseFloat(document.getElementById('edit-tx-profit').value); if (!txId || isNaN(newProfit)) { alert('Please select a transaction and enter a value.'); return; } const tx = currentClient.transactions.find(t => t.id === txId); if (!tx) return; const oldProfit = tx.profit || 0; const profitChange = newProfit - oldProfit; tx.profit = newProfit; currentClient.balance = (currentClient.balance || 0) + profitChange; db.clients[currentClient.txId] = currentClient; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); alert(`✅ Transaction updated!\nOld: $${oldProfit.toFixed(2)}\nNew: $${newProfit.toFixed(2)}\nBalance adjusted by: $${profitChange.toFixed(2)}`); renderTransactionsForManager(); openProfile(currentClient.txId); }
        async function saveProfileData() { if (!currentClient) return; if (currentUserRole === 'CLOSER') { alert('Permission denied.'); return; } db.clients[currentClient.txId].phone = document.getElementById('p-phone').value; db.clients[currentClient.txId].country = document.getElementById('p-country').value; db.clients[currentClient.txId].email = document.getElementById('p-email').value; db.clients[currentClient.txId].source = document.getElementById('p-source').value; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); renderTable(); }
        async function transmitStatusUpdate() { if (!currentClient) return; db.clients[currentClient.txId].status = document.getElementById('p-status-depositor').value; db.clients[currentClient.txId].retention = document.getElementById('p-status-retention').value; db.clients[currentClient.txId].subStatus = document.getElementById('p-status-sub').value; db.clients[currentClient.txId].agent = document.getElementById('p-agent-select').value; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); renderTable(); }
        async function injectProfit() { if (!currentClient) return; const amount = parseFloat(document.getElementById('profit-amount').value); const asset = document.getElementById('profit-asset').value.trim(); if (!amount || !asset) { alert('Please enter both amount and asset.'); return; } const txId = 'TX-' + Math.floor(Math.random() * 90000 + 10000); const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '.'); if (!currentClient.transactions) currentClient.transactions = []; currentClient.transactions.push({ id: txId, date: today, type: 'PROFIT', asset: asset, amount: 0, profit: amount, status: 'COMPLETED' }); currentClient.balance = (currentClient.balance || 0) + amount; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); document.getElementById('p-balance').textContent = '$' + currentClient.balance.toLocaleString('en-US', {minimumFractionDigits: 2}); document.getElementById('profit-amount').value = ''; document.getElementById('profit-asset').value = ''; openProfile(currentClient.txId); }
        async function approveWithdrawal(wdId) { if (!currentClient) return; const wd = currentClient.withdrawals.find(w => w.id === wdId); if (!wd) return; wd.status = 'APPROVED'; currentClient.balance = (currentClient.balance || 0) - wd.amount; currentClient.withdrawn = (currentClient.withdrawn || 0) + wd.amount; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); document.getElementById('p-balance').textContent = '$' + currentClient.balance.toLocaleString('en-US', {minimumFractionDigits: 2}); openProfile(currentClient.txId); checkWithdrawalAlerts(); }
        async function rejectWithdrawal(wdId) { if (!currentClient) return; const wd = currentClient.withdrawals.find(w => w.id === wdId); if (!wd) return; wd.status = 'REJECTED'; db.clients[currentClient.txId].lastActivity = Date.now(); await queueSave(); openProfile(currentClient.txId); checkWithdrawalAlerts(); }
        async function addComment() { 
            const input = document.getElementById('new-comment'); 
            const text = input.value.trim(); 
            if (!text || !currentClient) return; 
            const btn = document.getElementById('btn-add-comment');
            btn.disabled = true;
            btn.textContent = 'SAVING...';
            const now = new Date().toLocaleString(); 
            if (!currentClient.comments) currentClient.comments = [];
            currentClient.comments.unshift({agent: localStorage.getItem('verum_user') || "Manager", time: now, text: text});
            currentClient.lastActivity = Date.now();
            const saved = await queueSave();
            btn.disabled = false;
            btn.textContent = 'TRANSMIT';
            if (saved) {
                input.value = ''; 
                openProfile(currentClient.txId);
                renderTable();
            } else {
                currentClient.comments.shift();
            }
        }
        function switchTab(tabId, btn) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); btn.classList.add('active'); document.getElementById(`tab-${tabId}`).classList.add('active'); }
        function openModal(id) { document.getElementById(`modal-${id}`).classList.add('active'); }
        function closeModal(id) { document.getElementById(`modal-${id}`).classList.remove('active'); }
        async function injectLead() { const name = document.getElementById('lead-name').value.trim(); const country = document.getElementById('lead-country').value.trim(); const phone = document.getElementById('lead-phone').value.trim(); const deposit = parseFloat(document.getElementById('lead-deposit').value); const email = document.getElementById('lead-email').value.trim(); const source = document.getElementById('lead-source').value.trim(); const agent = document.getElementById('lead-agent').value; if (!name || !country || !deposit) { alert('⚠️ Please fill Name, Country, and Deposit.'); return; } const txId = 'TX-' + Math.floor(Math.random() * 900000 + 100000); const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '.'); const now = Date.now(); db.clients[txId] = { txId, agent, name, country, flag: '🌎', phone: phone, email: email, lastLogin: today + ' 09:00', balance: deposit, withdrawn: 0, deposit, status: 'NEW LEAD', retention: 'NEW', subStatus: 'POTENTIAL', source: source || 'Manual Entry', comment: 'New lead injected.', comments: [], transactions: [{id: txId, date: today, type: 'DEPOSIT', asset: 'Initial Capital', amount: deposit, profit: 0, status: 'COMPLETED'}], withdrawals: [], lastActivity: now }; await queueSave(); closeModal('injectLead'); document.getElementById('lead-name').value = ''; document.getElementById('lead-country').value = ''; document.getElementById('lead-phone').value = ''; document.getElementById('lead-deposit').value = ''; document.getElementById('lead-email').value = ''; document.getElementById('lead-source').value = ''; renderTable(); updateLeadCounter(); }
        function logout() { localStorage.clear(); window.location.href = '/login'; }
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initCRM); } else { initCRM(); }
    </script>
