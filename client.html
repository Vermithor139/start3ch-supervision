<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verum Trady | Client Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --green: #10b981;
            --red: #ef4444;
            --blue: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text); }

        /* Top Navbar */
        .navbar { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .logo { font-weight: 700; font-size: 1.15rem; color: var(--blue); display: flex; align-items: center; gap: 8px; }
        .logo span { font-size: 0.75rem; background: rgba(37, 99, 235, 0.1); padding: 2px 6px; border-radius: 4px; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .btn-deposit { background: #0f172a; color: white; padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer; }
        .profile-select { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; font-weight: 500; color: var(--text); cursor: pointer; }

        /* Balance Bar */
        .balance-bar { display: flex; gap: 32px; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; font-size: 0.825rem; }
        .balance-item span { display: block; color: var(--text-muted); font-size: 0.725rem; text-transform: uppercase; font-weight: 600; }
        .balance-item strong { font-size: 1rem; color: var(--text); }

        /* Layout Grid */
        .trading-container { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 120px); }
        .chart-section { padding: 16px; border-right: 1px solid var(--border); }
        .order-panel { padding: 20px; background: var(--bg-card); }

        /* Order Form */
        .order-header { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-buy { flex: 1; background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-sell { flex: 1; background: #f1f5f9; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <div class="logo">⚡ Verum Trady <span>Client Portal</span></div>
        <div class="nav-right">
            <!-- Profile Switcher to address employee/supervisor view feedback -->
            <select class="profile-select" onchange="handleProfileSwitch(this.value)">
                <option value="client">👤 Viewing as: Client Account</option>
                <option value="agent">👔 Viewing as: Closer / Sales Agent</option>
                <option value="supervisor">⭐ Viewing as: Julian Sterling (Supervisor)</option>
            </select>
            <button class="btn-deposit">DEPOSITAR</button>
            <a href="/" style="font-size:0.8rem; color:var(--text-muted); text-decoration:none;">Supervisor Terminal ➔</a>
        </div>
    </div>

    <!-- Account Balance Meters -->
    <div class="balance-bar">
        <div class="balance-item">
            <span>Total Balance</span>
            <strong>$254.36 USD</strong>
        </div>
        <div class="balance-item">
            <span>Cuota</span>
            <strong>$0.00</strong>
        </div>
        <div class="balance-item">
            <span>Equity</span>
            <strong>$254.36</strong>
        </div>
        <div class="balance-item">
            <span>Margin</span>
            <strong>$0.00</strong>
        </div>
        <div class="balance-item">
            <span>Margin Free</span>
            <strong style="color:var(--green);">$254.36</strong>
        </div>
    </div>

    <!-- Trading Dashboard -->
    <div class="trading-container">
        <!-- Interactive Chart -->
        <div class="chart-section" id="tv_chart_container"></div>

        <!-- Order Execution Panel -->
        <div class="order-panel">
            <div style="font-weight:700; font-size:1.1rem; margin-bottom:16px;">Libre 254,36 USD</div>
            <div class="order-header">
                <button class="btn-buy" onclick="alert('Order executed successfully!')">Comprar</button>
                <button class="btn-sell" onclick="alert('Sell order placed!')">Vender</button>
            </div>

            <div class="form-group">
                <label>Volumen</label>
                <input type="text" class="form-control" value="0.01">
            </div>
            <div class="form-group">
                <label>Símbolo</label>
                <select class="form-control">
                    <option>BRENT</option>
                    <option>EUR/USD</option>
                    <option>XAU/USD (Gold)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Apalancamiento</label>
                <input type="text" class="form-control" value="1:75" readonly>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "TVC:UKOIL",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "light",
            "style": "1",
            "locale": "en",
            "container_id": "tv_chart_container"
        });

        function handleProfileSwitch(role) {
            if (role === 'supervisor' || role === 'agent') {
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
